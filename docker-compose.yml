services:
  bot:
    build: .
    image: discord-gemini-bot
    working_dir: /app
    user: "10001:10001"
    ports:
      - "6060:6060" # Port for pprof
    # jedna z opcji:

    # A) wstrzyknięcie zmiennych z pliku:
    env_file:
      - ./.env

    # B) zamiast tego możesz zamontować sam plik (aplikacja szuka /app/.env):
    # volumes:
    #   - ./.env:/app/.env:ro
